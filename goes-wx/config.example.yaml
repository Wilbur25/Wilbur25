# Copy to config.yaml and edit. Every value has a default, so delete what you don't need.

location:
  name: Kansas City, MO          # shown on the dashboard
  lat: 39.0997
  lon: -94.5786
  metar_station: KMCI            # nearest airport (ICAO id) for observed conditions
  lightning_radius_km: 50        # "lightning nearby" alert radius

# Map area for imagery: [lon_min, lon_max, lat_min, lat_max]
region: [-104.0, -85.0, 32.0, 45.0]

units: imperial                  # imperial or metric
timezone: null                   # e.g. America/Chicago; null = use the computer's time zone

satellite:
  bucket: noaa-goes19            # GOES East (GOES-19). noaa-goes18 = GOES West
  product: ABI-L2-MCMIPC         # MCMIPC = CONUS every 5 min. Use ABI-L2-MCMIPF outside CONUS (every 10 min)
  interval_minutes: 10           # newest scan is always used; older scans are skipped down to this spacing
  keep_raw: false                # raw files are ~60 MB each; delete after rendering

imagery:
  products: [truecolor, ir, watervapor, airmass]
  lightning_overlay: true        # draw GLM flashes from the last 10 minutes on IR images
  dpi: 100
  width_px: 1280

timelapse:
  hours: 6                       # length of each loop
  fps: 12
  keep_frames_hours: 72

forecast:
  days: 7
  step_hours: 3                  # 1, 3 or 6
  resolution: 0p25               # 0p25 (~25 km) or 0p50 (~50 km, 4x smaller downloads)
  maps: true                     # daily high temperature and rain maps for the region

paths:
  data: ./data                   # raw downloads, database, trained models
  output: ./output               # dashboard, images, videos
